<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Savings Analysis M&R</title>
    <!-- Substitua o href pelo caminho correto do seu arquivo CSS, se necessário -->
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js para o Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <!-- PapaParse para ler CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <!-- =========================================
         TELA DE LOGIN
    ========================================= -->
    <div id="tela-login">
        <div class="login-card">
            <div class="login-header">
                <h2>COST SAVINGS ANALYSIS</h2>
                <p>MARTINS & ROSA</p>
            </div>
            <div class="input-group">
                <label for="emailLogin">E-mail Corporativo</label>
                <input type="email" id="emailLogin" placeholder="exemplo@martinserosa.com">
            </div>
            <div class="input-group">
                <label for="senhaLogin">Senha de Acesso</label>
                <input type="password" id="senhaLogin" placeholder="••••••••">
            </div>
            <button onclick="window.fazerLogin()" class="btn">ENTRAR NO SISTEMA</button>
        </div>
    </div>

    <!-- =========================================
         SISTEMA (OCULTO ATÉ LOGIN)
    ========================================= -->
    <div id="app" class="hidden">
        
        <!-- Cabeçalho Executivo -->
        <header class="app-header">
            <div>
                <h1>COST SAVINGS ANALYSIS M&R</h1>
                <p>Análise de Economias Martins & Rosa</p>
            </div>
            <button onclick="window.sairApp()">Sair do Sistema</button>
        </header>

        <!-- Barra de Navegação -->
        <nav class="tab-bar">
            <button id="btn-tab-importacao" class="tab-btn" onclick="window.mudarAba('importacao')">📥 Importação</button>
            <button id="btn-tab-registros" class="tab-btn active" onclick="window.mudarAba('registros')">📂 Registros</button>
            <button id="btn-tab-dashboard" class="tab-btn" onclick="window.mudarAba('dashboard')">📊 Dashboard</button>
            <button id="btn-tab-config" class="tab-btn" onclick="window.mudarAba('config')">⚙️ Configurações</button>
        </nav>

        <!-- Área de Conteúdo Central -->
        <main class="app-content">

            <!-- PAINEL 1: IMPORTAÇÃO -->
            <div id="painel-importacao" class="panel">
                <div class="card">
                    <h3>Importar Extrato Bancário</h3>
                    <div class="input-group">
                        <label>Selecione a Conta:</label>
                        <select id="contaImportacao"></select>
                    </div>
                    <div class="input-group">
                        <label>Arquivo (OFX ou CSV):</label>
                        <input type="file" id="arquivoExtrato" accept=".ofx,.csv" onchange="window.processarArquivo(event)">
                    </div>
                </div>
                <!-- Formulário de Lançamento Avulso (Manual) -->
                <div class="card">
                    <h3>Lançamento Manual</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="input-group"><label>Data</label><input type="date" id="avulsoData"></div>
                        <div class="input-group"><label>Conta</label><select id="avulsoConta"></select></div>
                        <div class="input-group"><label>Descrição</label><input type="text" id="avulsoDesc"></div>
                        <div class="input-group"><label>Valor (R$)</label><input type="number" id="avulsoValor" step="0.01"></div>
                        <div class="input-group"><label>Tipo</label><select id="avulsoTipo"><option value="despesa">Despesa (-)</option><option value="receita">Receita (+)</option></select></div>
                    </div>
                    <button class="btn" onclick="window.adicionarLancamentoAvulso()" style="width: 200px;">Adicionar Lançamento</button>
                </div>
            </div>

            <!-- PAINEL 2: REGISTROS -->
            <div id="painel-registros" class="panel active">
                <div class="card">
                    <h3>Filtros e Lançamentos</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px;">
                        <div class="input-group">
                            <label>BANCO/CONTA:</label>
                            <select id="filtroConta" onchange="window.renderizarRegistrosSalvos()"></select>
                        </div>
                        <div class="input-group">
                            <label>CATEGORIA:</label>
                            <select id="filtroCategoria" onchange="window.renderizarRegistrosSalvos()"></select>
                        </div>
                        <div class="input-group">
                            <label>TIPO:</label>
                            <select id="filtroTipo" onchange="window.renderizarRegistrosSalvos()">
                                <option value="todos">Todos</option>
                                <option value="receita">Receitas (+)</option>
                                <option value="despesa">Despesas (-)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>ORDENAR POR:</label>
                            <select id="filtroOrdem" onchange="window.renderizarRegistrosSalvos()">
                                <option value="data_desc">Data (Mais Novos)</option>
                                <option value="data_asc">Data (Mais Antigos)</option>
                                <option value="valor_desc">Maior Valor</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div id="area-pendentes"></div>
                <div id="area-sanfonas"></div>
            </div>

            <!-- PAINEL 3: DASHBOARD -->
            <div id="painel-dashboard" class="panel">
                <div id="painel-dashboard-content">
                    <!-- O app.js injeta o Dashboard inteiro aqui dentro -->
                </div>
            </div>

            <!-- PAINEL 4: CONFIGURAÇÕES -->
            <div id="painel-config" class="panel">
                <div class="card">
                    <h3>Cadastro de Contas Bancárias</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                        <div class="input-group"><label>Banco</label><input type="text" id="cadBanco" placeholder="Ex: Nubank"></div>
                        <div class="input-group"><label>Titular</label><input type="text" id="cadTitular"></div>
                        <div class="input-group"><label>Fonte (Opcional)</label><input type="text" id="cadFonte"></div>
                    </div>
                    <button class="btn" onclick="window.adicionarConta()" style="width: 200px;">Salvar Conta</button>
                    <div id="lista-contas-container" style="margin-top: 20px;"></div>
                </div>

                <div class="card">
                    <h3>Zerar Sistema</h3>
                    <p style="color: var(--text-muted); font-size: 13px;">Use estas opções para apagar o histórico e recomeçar.</p>
                    <button class="btn" style="background-color: var(--danger); width: auto; margin-right: 10px;" onclick="window.apagarTodoOExtrato()">Apagar Todo o Extrato</button>
                    <button class="btn" style="background-color: #F59E0B; width: auto;" onclick="window.apagarRegrasIA()">Apagar Regras da I.A.</button>
                </div>
            </div>

        </main>
    </div>

    <!-- Modais de Edição (Ocultos por padrão) -->
    <div id="modal-editar" class="hidden">
        <!-- Campos de edição (Mantenha seu modal atual aqui se tiver uma estrutura específica) -->
        <input type="hidden" id="editId">
        <input type="date" id="editData">
        <input type="text" id="editDesc">
        <input type="number" id="editValor">
        <select id="editTipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select>
        <button onclick="window.salvarEdicao()">Salvar</button>
    </div>

    <!-- Componente Toast de Notificação -->
    <div id="toast">Mensagem do Sistema</div>

    <!-- Vínculo com a inteligência do sistema -->
    <script type="module" src="app.js"></script>
</body>
</html>
